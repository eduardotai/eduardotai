<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="RunDB, community PC performance database">
  <rect width="1200" height="300" fill="#0b0f0c"/>
  <rect x="0" y="0" width="1200" height="3" fill="#36f97f"/>

  <text x="48" y="48" fill="#36f97f" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="4">FEATURED  /  LIVE</text>
  <text x="48" y="108" fill="#e8f6ee" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" letter-spacing="3">RunDB</text>
  <text x="48" y="148" fill="#cdeed8" font-family="Arial, Helvetica, sans-serif" font-size="22">Can your PC run it?</text>
  <text x="48" y="186" fill="#8aa394" font-family="Arial, Helvetica, sans-serif" font-size="15">Real FPS from real rigs. Settings, 1% lows, similar hardware.</text>
  <text x="48" y="210" fill="#8aa394" font-family="Arial, Helvetica, sans-serif" font-size="15">Steam / IGDB / PCGamingWiki ingest. Moderation before it goes public.</text>

  <rect x="48" y="236" width="118" height="28" rx="4" fill="#122018" stroke="#1e3a2a"/>
  <text x="107" y="255" fill="#9dceb0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">NEXT.JS 16</text>
  <rect x="176" y="236" width="100" height="28" rx="4" fill="#122018" stroke="#1e3a2a"/>
  <text x="226" y="255" fill="#9dceb0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">SUPABASE</text>
  <rect x="286" y="236" width="96" height="28" rx="4" fill="#122018" stroke="#1e3a2a"/>
  <text x="334" y="255" fill="#9dceb0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">POSTGRES</text>
  <rect x="392" y="236" width="88" height="28" rx="4" fill="#122018" stroke="#1e3a2a"/>
  <text x="436" y="255" fill="#9dceb0" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="middle">VERCEL</text>

  <text x="760" y="48" fill="#4d6b5a" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">AVG FPS  /  1% LOW</text>

  <rect x="760" y="72" width="392" height="176" rx="8" fill="#101613" stroke="#1a2a20"/>

  <g stroke="#1e3a2a" stroke-width="1">
    <line x1="792" y1="96" x2="1120" y2="96"/>
    <line x1="792" y1="132" x2="1120" y2="132"/>
    <line x1="792" y1="168" x2="1120" y2="168"/>
    <line x1="792" y1="204" x2="1120" y2="204"/>
  </g>

  <polyline fill="none" stroke="#36f97f" stroke-width="2.5" stroke-linejoin="round" points="792,188 824,170 856,176 888,142 920,150 952,118 984,128 1016,102 1048,112 1080,90 1112,98"/>
  <polyline fill="none" stroke="#36f97f" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55" points="792,210 824,198 856,202 888,180 920,186 952,164 984,172 1016,154 1048,160 1080,146 1112,150"/>

  <text x="792" y="230" fill="#4d6b5a" font-family="Arial, Helvetica, sans-serif" font-size="11">Excellent / Good / Playable / Struggling / Unplayable</text>
</svg>
